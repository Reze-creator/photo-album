# start.ps1 会用实际目录和端口替换占位符，并在启动前执行 nginx -t。
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log logs/access.log;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 127.0.0.1:__WEB_PORT__;
        root "__FRONTEND_DIST__";
        index index.html;
        client_max_body_size 11m;

        location /api/ {
            # proxy_pass 不附带 URI，保留原始 /api/v1/ 路径。
            proxy_pass http://127.0.0.1:__BACKEND_PORT__;
            proxy_set_header Host $host;
        }

        location /uploads/ {
            # 图片交给 Gin 判断访问权限，Nginx 不映射实际上传目录。
            proxy_pass http://127.0.0.1:__BACKEND_PORT__;
            proxy_set_header Host $host;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            # History 路由直接打开或刷新时，由 Vue 接管页面路由。
            try_files $uri $uri/ /index.html;
        }
    }
}
